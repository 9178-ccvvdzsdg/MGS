<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MGS梦室官网。</title>
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
  <meta name="theme-color" content="#000000">
  <style>
    body{color:#ffffff;font-family:sans-serif;overflow:hidden;margin:0;padding:0;background-color:#000000}
    [hidden]{display:none!important}
    #app,#loading,#error,#launch{position:absolute;top:0;left:0;width:100%;height:100%}
    .screen{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:default;user-select:none;-webkit-user-select:none;background-color:#000000}
    #launch{background-color:rgba(0,0,0,0.7);cursor:pointer}
    .green-flag{width:80px;height:80px;padding:16px;border-radius:100%;background:rgba(255,255,255,0.75);border:3px solid hsla(0,100%,100%,1);display:flex;justify-content:center;align-items:center;box-sizing:border-box}
    .progress-bar-outer{border:1px solid currentColor;height:10px;width:200px;max-width:200px}
    .progress-bar-inner{height:100%;width:0;background-color:currentColor}
    .loading-text{font-weight:normal;font-size:36px;margin:0 0 16px}
    .loading-image{margin:0 0 16px}
    #error-message,#error-stack{font-family:monospace;max-width:600px;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
    #error-stack{text-align:left;max-height:200px;overflow:auto}
    .control-button{width:2rem;height:2rem;padding:0.375rem;margin-top:0.5rem;margin-bottom:0.5rem;user-select:none;-webkit-user-select:none;cursor:pointer;border:0;border-radius:4px}
    .control-button-highlight:hover{background:#ff4c4c26}
    .control-button-highlight.active{background:#ff4c4c59}
    .fullscreen-button{background:white}
    .standalone-fullscreen-button{position:absolute;top:0;right:0;background-color:rgba(0,0,0,0.5);border-radius:0 0 0 4px;padding:4px;cursor:pointer}
    .sc-canvas{cursor:auto}
    .sc-monitor-root[data-opcode^="data_"] .sc-monitor-value-color{background-color:#ff8c1a}
    .sc-monitor-row-value-outer{background-color:#fc662c}
    .sc-monitor-row-value-editing .sc-monitor-row-value-outer{background-color:#e25b27}
  </style>
</head>
<body>
  <div id="app"><div id="loading" class="screen"><div class="loading-image"><div class="green-flag"><svg viewBox="0 0 52.667 74.667" width="48" height="48"><defs><style>.a{fill:#4cbf4c;}.b{fill:#3b8b3b;}</style></defs><rect class="a" width="52.667" height="74.667" rx="8"/><rect class="b" x="16.667" y="12.667" width="10.667" height="10.667" rx="2"/></svg></div></div><p class="loading-text">正在加载游戏...</p><div class="progress-bar-outer"><div class="progress-bar-inner" id="progress"></div></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/turbowarp@1.6.1/desktop.js" async onload="initTW()" onerror="initTW()"></script>
  <script>
    var projectId = 'REPLACE_WITH_YOUR_PROJECT_ID';
    var progressEl = document.getElementById('progress');
    var progress = 0;
    var tw;

    function initTW() {
      tw = window.TurboWarp;
      if (!tw) { loadLocal(); return; }
      progress = 30;
      progressEl.style.width = progress + '%';

      var p = tw.createProject('https://turbowarp.org/' + projectId + '/embed', {
        container: document.getElementById('app'),
        compilerOptions: {},
        onInitialized: function() {
          progress = 70;
          progressEl.style.width = progress + '%';
          tw.loadProject();
        }
      });

      p.then(function() {
        progress = 100;
        progressEl.style.width = progress + '%';
        document.getElementById('loading').style.display = 'none';
        tw.run();
      }).catch(function() {
        loadLocal();
      });
    }

    function loadLocal() {
      document.getElementById('loading').innerHTML = '<p class="loading-text">请访问</p><a href="https://scratch.mit.edu/projects/' + projectId + '" target="_blank" style="color:#e94560;font-size:1.2rem">在 Scratch 打开作品</a>';
    }
  </script>
</body>
</html>
